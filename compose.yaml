# One-command CPU-compatible local AI stack.
# Only the web UI is published to the host, exclusively on 127.0.0.1.
# Ollama port 11434 is NOT published; it remains on an isolated internal network.
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - rei_ollama_models:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: "1"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh","-c","ollama pull ${REI_MODEL:-qwen3:4b-instruct}"]
    restart: "no"

  rei:
    build:
      context: .
      dockerfile: Dockerfile.rei
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      REI_MODEL: ${REI_MODEL:-qwen3:4b-instruct}
      REI_OLLAMA_URL: http://ollama:11434
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "127.0.0.1:7861:7861"

volumes:
  rei_ollama_models:
