name: Import verified REI public source package

on:
  push:
    branches:
      - publish-rei-1-0
    paths:
      - REI_GitHub_Repository.zip

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'ted-peters/RecursiveEpistemicIntelligence' && !startsWith(github.event.head_commit.message, 'Import REI-1.0 public research source')
    runs-on: ubuntu-latest
    steps:
      - name: Check out upload branch
        uses: actions/checkout@v4
        with:
          ref: publish-rei-1-0
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and extract the public archive
        env:
          EXPECTED_SHA256: b02145d875bcb6319d69cf4f7def192e0be064e185cdd5ea3e519bac5e74ab77
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path, PurePosixPath
          import shutil
          import stat
          import zipfile

          archive = Path("REI_GitHub_Repository.zip")
          if not archive.is_file():
              raise SystemExit("The expected REI archive has not been uploaded.")
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          expected = os.environ["EXPECTED_SHA256"]
          if digest != expected:
              raise SystemExit(f"Archive SHA-256 mismatch; expected {expected}, found {digest}")
          with zipfile.ZipFile(archive) as z:
              infos = z.infolist()
              if len(infos) != 130:
                  raise SystemExit(f"Unexpected archive entry count: {len(infos)}")
              if sum(i.file_size for i in infos) > 2_000_000:
                  raise SystemExit("Archive extracted size too large")
              paths = set()
              for entry in infos:
                  name = entry.filename
                  path = PurePosixPath(name)
                  if (
                      path.is_absolute() or ".." in path.parts
                      or not name or "\\" in name
                      or name.startswith(".git/")
                      or name == ".git"
                      or len(path.parts) > 12
                      or (entry.external_attr >> 16) & 0o170000 == stat.S_IFLNK
                  ):
                      raise SystemExit(f"Unsafe archive member: {name!r}")
                  if name in paths:
                      raise SystemExit(f"Duplicate archive member: {name}")
                  paths.add(name)
              for entry in infos:
                  if entry.is_dir():
                      continue
                  dest = Path(entry.filename)
                  if entry.filename == "LICENSE":
                      # Keep the repository owner's existing MIT license and copyright.
                      continue
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(entry) as source, dest.open("wb") as target:
                      shutil.copyfileobj(source, target)
          archive.unlink()
          print(f"Verified and imported {len(infos)} source entries.")
          PY

      - name: Commit imported source to the same branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import REI-1.0 public research source (verified archive)"
            git push origin HEAD:publish-rei-1-0
          fi
