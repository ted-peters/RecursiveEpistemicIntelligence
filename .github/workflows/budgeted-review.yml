name: Budgeted review confirmation
on:
  workflow_dispatch:
  push:
    branches: [compact-cited-review]
    paths:
      - research/adaptive_rei/compact_review_trial.py
      - research/adaptive_rei/budgeted_review_controls.json
      - .github/workflows/budgeted-review.yml
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Start pinned Ollama on CPU
        run: |
          curl -fsSL --retry 3 https://github.com/ollama/ollama/releases/download/v0.12.11/ollama-linux-amd64.tgz -o /tmp/ollama.tgz
          echo 'fb140ea4243706d0087b0108418ee5c6f74edcebf5f14e2f289b8e36bd303d0f  /tmp/ollama.tgz' | sha256sum -c
          mkdir /tmp/rei-ollama
          tar -xzf /tmp/ollama.tgz -C /tmp/rei-ollama
          /tmp/rei-ollama/bin/ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://localhost:11434/api/tags; then break; fi
            sleep 2
          done
          /tmp/rei-ollama/bin/ollama pull qwen3:4b-instruct
      - name: Run paired comparison
        run: python3 research/adaptive_rei/compact_review_trial.py --budgeted --shard ${{ matrix.shard }} | tee result.json
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: budgeted-review-${{ matrix.shard }}
          path: result.json
