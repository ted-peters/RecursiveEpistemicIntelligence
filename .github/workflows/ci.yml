name: REI regression tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # frozen synthetic reports use 3.13-compatible float-sum semantics
      - name: Install
        run: python -m pip install .
      - name: Tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
