name: REI Challenge 11 — Active investigation software audit
on:
  push:
    branches: [challenge11-active-investigation]
    paths:
      - 'research/challenge11/**'
      - 'tests/test_challenge11_*.py'
      - '.github/workflows/challenge11-active-investigation.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Select FREE software fixture or separately opted-in real Qwen3 model'
        type: choice
        required: true
        default: fixture
        options: [fixture, live]
permissions:
  contents: read
jobs:
  free-synthetic-benchmark:
    name: Independent two-probe Bayes-risk policy comparison (no model)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify original REI and Challenge 11 tests
        run: |
          python -m pip install .
          python -m unittest discover -s tests -p test_challenge11_voi.py -v
          python -m unittest discover -s tests -p test_challenge11_pilot.py -v
      - name: Run 24 paired simulated worlds with signed measurements
        run: |
          python -m research.challenge11.simulate \
            --seed 20261112 --count 24 --output challenge11-results/policy-audit.json
          python -m research.challenge11.simulate \
            --verify-only --output challenge11-results/policy-audit.json
      - name: Test same numeric tools with synthetic model choices (NOT live inference)
        run: |
          python -m research.challenge11.pilot \
            --mode fixture --seed 20261112 --count 4 \
            --output challenge11-results/choice-fixture.json
          python -m research.challenge11.pilot \
            --verify-only --output challenge11-results/choice-fixture.json
      - name: Summarize blinded-world simulation limitations
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path('challenge11-results/policy-audit.json').read_text())
          s=d['summary']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('## Challenge 11: Planning where to investigate\n\n')
            f.write('**Offline synthetic simulation — not a live model benchmark.**\n\n')
            f.write('| Policy | Mean exact expected Bayes error | Realized correct | Probes |\n|---|---:|---:|---:|\n')
            for arm in ('recursive_voi','greedy_voi'):
              row=s[arm]
              f.write(f"| {arm} | {row['mean_exact_expected_bayes_error']:.5f} | {row['realized_correct']}/{row['cases']} | {row['measurements']} |\n")
            f.write(f"\nLookahead strictly better than greedy (expected risk) on {d['number_of_cases_where_lookahead_beats_greedy_in_expected_risk']} of {d['count']} public scenarios.\n\n")
            f.write('**The exact lookahead planner is itself conventional Bayesian math; no claim of novel REI superiority.**\n')
          PY
      - name: Preserve software-only reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: challenge11-signed-active-investigation-software-audit
          path: challenge11-results
          retention-days: 90
          if-no-files-found: warn

  manual-qwen-pilot:
    name: Four-case live Qwen3 choice selection (manual only)
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'live'
    needs: free-synthetic-benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install .
      - name: Build pinned llama.cpp engine
        run: |
          git clone -q --depth 1 --branch b12242 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          git -C /tmp/llama.cpp rev-parse HEAD > /tmp/llama_commit.txt
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF -DGGML_NATIVE=ON
          cmake --build /tmp/llama.cpp/build -j 4 --target llama-server
      - name: Download SHA-256-pinned Qwen3-4B open-weight model
        run: |
          mkdir -p /tmp/c11-model
          curl -L --fail --retry 2 --connect-timeout 30 \
            'https://huggingface.co/fzhnk/qwen3-4b-instruct-2507-gguf/resolve/main/qwen3-4b-instruct-2507-q4_K_M.gguf' \
            -o /tmp/c11-model/model.gguf
          echo '85e4a5b7b8ef0e48af0e8658f5aaab9c2324c76c1641493f4d1e25fce54b18b9  /tmp/c11-model/model.gguf' | sha256sum -c
      - name: Start local model server
        run: |
          /tmp/llama.cpp/build/bin/llama-server -m /tmp/c11-model/model.gguf \
            --alias qwen3-4b-instruct-2507-q4_k_m --host 127.0.0.1 --port 8099 -c 8192 -t 4 -np 1 \
            > /tmp/c11-server.log 2>&1 &
          for n in $(seq 1 90); do
            if curl --fail -s http://127.0.0.1:8099/health | grep -q 'ok'; then exit 0; fi
            sleep 2
          done
          tail -100 /tmp/c11-server.log
          exit 1
      - name: Run four REAL paired investigation-selection cases
        run: |
          timeout 3100s python -m research.challenge11.pilot \
            --mode live --count 4 --seed 20261112 \
            --model-file /tmp/c11-model/model.gguf \
            --engine-commit "$(cat /tmp/llama_commit.txt)" \
            --output challenge11-results/choice-live.json
          python -m research.challenge11.pilot \
            --verify-only --output challenge11-results/choice-live.json
      - name: Preserve model results (best effort)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: challenge11-fourcase-live-selection
          path: challenge11-results/choice-live.json
          retention-days: 90
          if-no-files-found: warn
