name: Publish REI interactive Space

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'space-static/**'
      - 'tests/test_static_space.py'
      - '.github/workflows/publish-huggingface.yml'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Deployment target confirmed by owner on 2026-11-11.
    # The owner must approve this GitHub workflow in Hugging Face Space Trusted Publishers.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate public browser demonstration
        run: python -m unittest discover -s tests -p test_static_space.py -v
      - name: Install Hugging Face CLI (OIDC-capable)
        run: python -m pip install 'huggingface_hub>=1.19,<2'
      - name: Upload free static demo to Hugging Face
        env:
          HF_SPACE_ID: tedpeters/RecursiveEpistemicIntelligence
          HF_OIDC_RESOURCE: spaces/tedpeters/RecursiveEpistemicIntelligence
        run: |
          set -euo pipefail
          hf upload "$HF_SPACE_ID" ./space-static . --repo-type space \
            --commit-message "Publish REI browser demo from GitHub ${GITHUB_SHA::12}"
